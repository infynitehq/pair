# DEVELOPMENT ONLY: loopback relay for Chromium integration on Linux.
listening-ip=127.0.0.1
relay-ip=127.0.0.1
listening-port=3478
min-port=50000
max-port=50050
realm=pair.local.test
fingerprint
use-auth-secret
# Public fixture secret, deliberately not a production credential.
static-auth-secret=pair-development-only-turn-secret-never-use-in-production
allow-loopback-peers
no-multicast-peers
no-tls
no-dtls
no-cli
no-tcp-relay
user-quota=4
total-quota=32
max-bps=1000000
bps-capacity=32000000
# Avoid persisting temporary authentication usernames in logs.
log-file=/dev/null
simple-log
no-stdout-log
